# /etc/nginx/sites-available/details-wms.cloud — replaces the static portal config.
# Everything goes to the gateway on 127.0.0.1:4000.

limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/s;

upstream details_gateway {
    server 127.0.0.1:4000;
    keepalive 16;
}

# HTTP -> HTTPS (+ ACME challenge)
server {
    listen 80;
    listen [::]:80;
    server_name details-wms.cloud www.details-wms.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portal;
        default_type text/plain;
    }
    location / { return 301 https://details-wms.cloud$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name details-wms.cloud www.details-wms.cloud;

    ssl_certificate     /etc/letsencrypt/live/details-wms.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/details-wms.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    if ($host = www.details-wms.cloud) { return 301 https://details-wms.cloud$request_uri; }

    # Security headers (CSP is set by the app on HTML responses)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    server_tokens off;
    client_max_body_size 3m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portal;
        default_type text/plain;
    }

    # Internal endpoint for auth_request (never reachable from outside)
    location = /_gw/verify {
        internal;
        proxy_pass http://details_gateway/_gw/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Gw-System "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=portal burst=40 nodelay;
        proxy_pass http://details_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}
