<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الروابط السريعة · بوابة ديتيلز</title>
<link rel="icon" href="/static/assets/favicon.png">
<link rel="stylesheet" href="/static/css/gateway.css?v=202610140905">
</head>
<body data-page="links">
<header class="top">
  <div class="brand">
    <img src="/static/assets/logo-details.png" alt="ديتيلز" class="logo">
    <div>
      <h1>الروابط السريعة</h1>
      <p class="sub">روابط المنصات الحكومية والجهات التي يتعامل معها المكتب</p>
    </div>
  </div>
  <div class="user">
    <a class="btn ghost" href="/">بوابة ديتيلز</a>
    <a class="btn ghost" href="/logout">خروج</a>
  </div>
</header>
<main class="ql-wrap">
  <section class="ql-top" id="top" hidden></section>
  <div class="toolbar ql-toolbar">
    <input id="q" type="search" placeholder="ابحث في كل الأعمدة…" autocomplete="off" aria-label="بحث">
    <span class="muted small" id="count"></span>
    <span class="spacer"></span>
    <button class="btn small" id="expandall" type="button" title="فتح/طي كل التصنيفات">فتح الكل</button>
    <button class="btn small primary" id="addbtn" type="button" hidden>+ رابط جديد</button>
  </div>
  <section id="list"><p class="muted">جارٍ التحميل…</p></section>
</main>
<footer>
  <span>© <span id="year"></span> ديتيلز للاستشارات الهندسية</span>
  <span class="sep">·</span>
  <span>بيانات الدخول للمنصات في «المعلومات التقنية» (للمشرف العام)</span>
  <span class="sep">·</span>
  <span>كل نقرة تُسجَّل لمعرفة الروابط الأكثر استخدامًا</span>
</footer>
<script src="/static/js/common.js?v=202610140905"></script>
<script src="/static/js/links.js?v=202610140905"></script>
</body>
</html>
