<!doctype html>
<html lang="ar" dir="rtl" class="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>رمز التحقق · نظام ديتيلز لإدارة العمل</title>
<link rel="icon" href="/static/assets/favicon.png">
<link rel="stylesheet" href="/static/css/gateway.css?v=202610140905">
<link rel="stylesheet" href="/static/css/login-theme.css?v=202610140905">
</head>
<body class="lt">

<main class="auth">
  <section class="panel center" aria-labelledby="pg-title">
    <header class="lt-head">
      <img src="/static/assets/logo-details.png" alt="ديتيلز" class="lt-logo">
      <h1 class="lt-title" id="pg-title">نظام ديتيلز لإدارة العمل</h1>
      <p class="lt-sub">Details WMS</p>
    </header>

    <p class="greet"><small id="daypart">أهلًا بك</small><span id="name"></span></p>
    <p class="lead" id="lead">أرسلنا رمز تحقق من أربعة أرقام.</p>
    <div class="err" id="err" role="alert" hidden></div>
    <div class="ok" id="okmsg" hidden></div>
    <div class="digits" id="code" aria-label="رمز التحقق"></div>
    <button class="btn primary block" id="verify" disabled>تحقق ودخول</button>
    <div class="resend">
      <a href="/login" class="linkbtn" id="back">تغيير الرقم الوظيفي</a>
      <button class="linkbtn" id="resend" disabled>إعادة الإرسال بعد <span id="count">60</span> ث</button>
    </div>
    <div class="resend"><button class="linkbtn" id="viamail" type="button" hidden>أرسل عبر البريد بدلًا</button></div>
    <p class="muted" id="ttl">صلاحية الرمز 5 دقائق. لا تشارك الرمز مع أي شخص.</p>

    <div class="lt-info" role="group" aria-label="تاريخ اليوم">
      <div class="lt-ic">
        <span class="cal" aria-hidden="true"></span>
        <div class="txt">
          <span class="lbl">التاريخ الميلادي</span>
          <span class="val" id="g-date">—</span>
          <span class="sub" id="g-sub"></span>
        </div>
      </div>
      <div class="lt-ic">
        <span class="cal" aria-hidden="true"></span>
        <div class="txt">
          <span class="lbl">التاريخ الهجري</span>
          <span class="val" id="h-date">—</span>
          <span class="sub" id="h-sub"></span>
        </div>
      </div>
    </div>

    <p class="lt-ver">
      <b>الإصدار 1.0.0</b><span class="sep">·</span>جميع الحقوق محفوظة © <span id="year"></span> شركة ديتيلز للاستشارات الهندسية
      <br>الاستخدام للموظفين المصرح لهم فقط
    </p>
  </section>
</main>

<script src="/static/js/common.js?v=202610140905"></script>
<script src="/static/js/login-theme.js?v=202610140905"></script>
<script src="/static/js/otp.js?v=202610140905"></script>
</body>
</html>
